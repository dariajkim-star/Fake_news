# Story 1.3 — BERT only baseline (ablation table 1행)
# 실행: python scripts/train.py --config configs/bert_only.yaml
_base_: fakeddit.yaml

exp_name: bert_only

data:
  modality: text          # 이미지 로딩 자체를 건너뛴다
  batch_size: 32
  tokenizer:
    name: bert-base-uncased
    max_length: 128
    truncation: true

model:
  name: text_only
  num_classes: 2
  text:
    model_name: bert-base-uncased
    pretrained: true      # 오프라인/CI에서는 false (랜덤 초기화, 네트워크 접근 없음)
    local_files_only: false
    pooling: cls          # cls | mean  — [CLS] 768-dim feature (AC5)
    freeze: false         # true면 backbone 고정, head만 학습 (단일 GPU 빠른 iteration)
    proj_dim: null        # null이면 768 그대로 (Story 1.4 concat 768+2048=2816)
    dropout: 0.1
    # pretrained: false일 때만 사용되는 랜덤 초기화 BertConfig 오버라이드
    # encoder_config:
    #   vocab_size: 30522
    #   num_hidden_layers: 12
  head:
    hidden_dims: null     # null이면 단일 Linear(768 -> 2)
    dropout: 0.1

train:
  epochs: 3
  lr: 0.00002             # BERT fine-tuning 권장 2e-5
  head_lr: 0.0001         # head는 더 크게 (param group 분리)
  weight_decay: 0.01
  grad_clip: 1.0
  amp: false              # 단일 GPU 메모리 부족 시 true (NFR1)
  monitor: f1
  monitor_mode: max
