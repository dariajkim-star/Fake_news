# Story 1.3 — ResNet only baseline (ablation table 2행)
# 실행: python scripts/train.py --config configs/resnet_only.yaml
_base_: fakeddit.yaml

exp_name: resnet_only

data:
  modality: image         # 토큰화 자체를 건너뛴다
  image_size: 224
  batch_size: 32
  tokenizer:
    name: null            # image 전용 — tokenizer 불필요

model:
  name: image_only
  num_classes: 2
  image:
    arch: resnet50        # torchvision ResNet-50 (pooled 2048-dim, AC5)
    pretrained: true      # ImageNet weights. 오프라인/CI에서는 false
    freeze: false         # true면 backbone 고정, fc head만 학습
    proj_dim: null        # null이면 2048 그대로 (Story 1.4 concat 768+2048=2816)
    dropout: 0.1
  head:
    hidden_dims: null     # null이면 단일 Linear(2048 -> 2)
    dropout: 0.1

train:
  epochs: 5
  lr: 0.0001              # ResNet fine-tuning
  head_lr: 0.001          # head는 더 크게
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: false
  monitor: f1
  monitor_mode: max
