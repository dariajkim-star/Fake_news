<svg viewBox="0 0 980 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>FinDeepfake-48h 아키텍처</title>
  <desc>학습 뷰: 세 데이터셋이 세 모델을 각각 학습하고 가설 H3, H1, H2를 검증. 추론 뷰: 영상과 오디오가 두 축으로 갈라져 REAL/FAKE와 SUPPORTED/REFUTED를 독립 산출하고 Risk Matrix로 합류.</desc>
  <style>
    .box { fill: #f5f5f5; stroke: #999; }
    .model { fill: #e8eefc; stroke: #3b62c8; }
    .data { fill: #f5f5f5; stroke: #999; stroke-dasharray: 4 3; }
    .out { fill: #f5f5f5; stroke: #999; }
    .t { fill: #222; font-size: 14px; }
    .t2 { fill: #666; font-size: 11.5px; }
    .h { fill: #222; font-size: 16px; font-weight: 700; }
    .hyp { fill: #3b62c8; font-size: 12.5px; font-weight: 700; }
    .arr { stroke: #999; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arrB { stroke: #3b62c8; stroke-width: 1.8; fill: none; marker-end: url(#ab); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b62c8"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="780" fill="#ffffff"/>

  <text x="30" y="34" class="h">학습 — 데이터셋 하나가 모델 하나를 가르친다</text>

  <rect x="30" y="56" width="290" height="46" class="data" rx="8"/>
  <text x="175" y="76" class="t" text-anchor="middle">OpenForensics <tspan font-weight="700">Train</tspan> ~10k</text>
  <text x="175" y="93" class="t2" text-anchor="middle">이미지 + 얼굴 bbox GT</text>

  <rect x="30" y="130" width="290" height="46" class="model" rx="8"/>
  <text x="175" y="150" class="t" text-anchor="middle" font-weight="700">YOLOv8n — 검출 [직접 학습]</text>
  <text x="175" y="167" class="t2" text-anchor="middle">FACE 1-class · "어디에 얼굴이?"</text>

  <rect x="30" y="204" width="290" height="46" class="out" rx="8"/>
  <text x="175" y="224" class="t" text-anchor="middle">OpenForensics <tspan font-weight="700">Val</tspan>에서 평가</text>
  <text x="175" y="241" class="t2" text-anchor="middle">D1 zero-shot vs D2 fine-tuned</text>

  <line x1="175" y1="102" x2="175" y2="128" class="arr"/>
  <line x1="175" y1="176" x2="175" y2="202" class="arr"/>
  <text x="330" y="232" class="hyp">← H3  ΔmAP@50</text>

  <rect x="345" y="56" width="290" height="46" class="data" rx="8"/>
  <text x="490" y="76" class="t" text-anchor="middle">DFDC part_02 (영상 1,748개)</text>
  <text x="490" y="93" class="t2" text-anchor="middle">family split · 2fps frame</text>

  <rect x="345" y="130" width="290" height="46" class="model" rx="8"/>
  <text x="490" y="150" class="t" text-anchor="middle" font-weight="700">EfficientNet-B0 — 분류 [직접 학습]</text>
  <text x="490" y="167" class="t2" text-anchor="middle">"그 얼굴이 진짜인가?"</text>

  <rect x="345" y="204" width="290" height="46" class="out" rx="8"/>
  <text x="490" y="224" class="t" text-anchor="middle">DFDC test — video-level</text>
  <text x="490" y="241" class="t2" text-anchor="middle">V0 full-frame vs V1 YOLO ROI</text>

  <line x1="490" y1="102" x2="490" y2="128" class="arr"/>
  <line x1="490" y1="176" x2="490" y2="202" class="arr"/>
  <text x="645" y="232" class="hyp">← H1  ΔAUROC</text>

  <path d="M 320 153 L 343 153" class="arrB"/>
  <text x="332" y="122" class="hyp" text-anchor="middle" font-size="11">ROI</text>
  <text x="332" y="135" class="t2" text-anchor="middle">transfer</text>

  <rect x="660" y="56" width="290" height="46" class="data" rx="8"/>
  <text x="805" y="76" class="t" text-anchor="middle">Fin-Fact (3,369 claim)</text>
  <text x="805" y="93" class="t2" text-anchor="middle">claim + evidence + label</text>

  <rect x="660" y="130" width="290" height="46" class="model" rx="8"/>
  <text x="805" y="150" class="t" text-anchor="middle" font-weight="700">DeBERTa-v3-small [직접 학습]</text>
  <text x="805" y="167" class="t2" text-anchor="middle">claim ↔ evidence 관계 판정</text>

  <rect x="660" y="204" width="290" height="46" class="out" rx="8"/>
  <text x="805" y="224" class="t" text-anchor="middle">Fin-Fact test — Macro-F1</text>
  <text x="805" y="241" class="t2" text-anchor="middle">N1 claim-only vs N2 +evidence</text>

  <line x1="805" y1="102" x2="805" y2="128" class="arr"/>
  <line x1="805" y1="176" x2="805" y2="202" class="arr"/>
  <text x="805" y="272" class="hyp" text-anchor="middle">← H2  ΔMacro-F1</text>

  <line x1="30" y1="300" x2="950" y2="300" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5"/>

  <text x="30" y="336" class="h">추론 — 입력 영상 하나, 판정 둘 (합치지 않는다)</text>

  <rect x="400" y="356" width="180" height="40" class="box" rx="8"/>
  <text x="490" y="381" class="t" text-anchor="middle" font-weight="700">INPUT VIDEO</text>

  <line x1="440" y1="396" x2="240" y2="428" class="arr"/>
  <line x1="540" y1="396" x2="740" y2="428" class="arr"/>
  <text x="290" y="416" class="t2">VIDEO frame (2fps)</text>
  <text x="620" y="416" class="t2">AUDIO 16kHz</text>

  <rect x="120" y="432" width="240" height="42" class="model" rx="8"/>
  <text x="240" y="452" class="t" text-anchor="middle" font-weight="700">YOLO (fine-tuned)</text>
  <text x="240" y="468" class="t2" text-anchor="middle">face bbox → crop 224²</text>

  <rect x="120" y="502" width="240" height="42" class="model" rx="8"/>
  <text x="240" y="522" class="t" text-anchor="middle" font-weight="700">EfficientNet-B0</text>
  <text x="240" y="538" class="t2" text-anchor="middle">frame prob → median 집계</text>

  <rect x="120" y="572" width="240" height="40" class="out" rx="8"/>
  <text x="240" y="597" class="t" text-anchor="middle" font-weight="700">REAL / FAKE  <tspan class="t2" font-weight="400">P(fake)</tspan></text>

  <line x1="240" y1="474" x2="240" y2="500" class="arr"/>
  <line x1="240" y1="544" x2="240" y2="570" class="arr"/>

  <rect x="620" y="432" width="240" height="42" class="model" rx="8"/>
  <text x="740" y="452" class="t" text-anchor="middle" font-weight="700">Whisper (STT)</text>
  <text x="740" y="468" class="t2" text-anchor="middle">transcript → 금융 claim 추출</text>

  <rect x="620" y="502" width="240" height="42" class="model" rx="8"/>
  <text x="740" y="522" class="t" text-anchor="middle" font-weight="700">DeBERTa</text>
  <text x="740" y="538" class="t2" text-anchor="middle">claim + evidence 대조</text>

  <rect x="620" y="572" width="240" height="40" class="out" rx="8"/>
  <text x="740" y="597" class="t" text-anchor="middle" font-weight="700">SUPPORTED / REFUTED</text>

  <line x1="740" y1="474" x2="740" y2="500" class="arr"/>
  <line x1="740" y1="544" x2="740" y2="570" class="arr"/>

  <rect x="870" y="432" width="90" height="42" class="data" rx="8"/>
  <text x="915" y="452" class="t2" text-anchor="middle" font-weight="700">Provided</text>
  <text x="915" y="466" class="t2" text-anchor="middle">Evidence</text>
  <path d="M 905 474 Q 880 495 862 508" class="arr"/>
  <text x="915" y="492" class="t2" text-anchor="middle" font-size="10.5">자동 생성 아님</text>

  <line x1="240" y1="612" x2="420" y2="660" class="arr"/>
  <line x1="740" y1="612" x2="560" y2="660" class="arr"/>
  <rect x="380" y="664" width="220" height="44" class="out" rx="8" stroke-width="2"/>
  <text x="490" y="684" class="t" text-anchor="middle" font-weight="700">RISK MATRIX 2×2</text>
  <text x="490" y="701" class="t2" text-anchor="middle">두 판정을 독립 제시, 해석만 조합</text>

  <text x="490" y="744" class="t2" text-anchor="middle">LOW · SYNTHETIC MEDIA · CLAIM RISK · HIGH RISK</text>

  <rect x="30" y="726" width="14" height="14" class="model" rx="3"/>
  <text x="50" y="738" class="t2">직접 학습 모델</text>
  <rect x="150" y="726" width="14" height="14" class="data" rx="3"/>
  <text x="170" y="738" class="t2">데이터/입력</text>
</svg>
